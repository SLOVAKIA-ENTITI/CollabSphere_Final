{% extends "base.html" %}
{% block title %}Vymazať{% endblock %}
{% block page_title %}Potvrdenie vymazania{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5">
    <div class="card border-danger">
      <div class="card-body text-center p-5">
        <i class="bi bi-exclamation-triangle-fill text-danger fs-1"></i>
        <h5 class="mt-3">Naozaj chcete vymazať {{ type }}</h5>
        <p class="text-muted">„<strong>{{ object }}</strong>"?</p>
        <p class="text-danger small">Táto akcia je nevratná.</p>
        <div class="d-flex gap-2 justify-content-center mt-4">
          <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger"><i class="bi bi-trash me-1"></i>Áno, vymazať</button>
          </form>
          <a href="javascript:history.back()" class="btn btn-outline-secondary">Zrušiť</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
